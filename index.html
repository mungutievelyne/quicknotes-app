
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Your Personal Note Keeper</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture ideas before they disappear.</p>
  </header>

  <main>
    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>

      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note text</label>
          <input
            type="text"
            id="note-input"
            placeholder="What do you want to remember?"
          >
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>

      <p id="error-message" role="alert"></p>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>

      <div class="form-group">
        <label for="search-input">Search notes</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search by note text..."
        >
      </div>

      <p id="note-count">You have no notes yet.</p>
      <button type="button" id="clear-all-btn">Clear all</button>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>
</body>
</html>
